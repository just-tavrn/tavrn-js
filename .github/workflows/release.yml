# SPDX-License-Identifier: Apache-2.0
#
# Release of @tavrn/sdk, @tavrn/e2ee and @tavrn/bot (docs/GITHUB.md "Releases"). Push a tag vX.Y.Z whose commit
# carries version X.Y.Z in all three package.json files: the workflow checks the tag, the generated types and the
# tests, packs the three npm tarballs (pnpm pack replaces workspace:* with the version) and attaches them to a
# GitHub release. Publishing to npm (with provenance) additionally needs the repository variable PUBLISH_ENABLED and
# refuses git dependencies (they must become version ranges first). Gated by CI_ENABLED.
#
# npm uses trusted publishing (OIDC, no token): the trusted publisher of @tavrn/sdk, @tavrn/e2ee and @tavrn/bot on
# npmjs.com is this repository, workflow release.yml, environment `release`, allowed action npm publish only; npm >=
# 11.5.1 exchanges the job's id-token for a short-lived publish token and attaches provenance. Rerunning the failed
# `publish` job after a partial publication is safe: a package whose version is already on npm is skipped.
#
# Three jobs, so that no dependency code ever runs next to a publishing credential: `build` installs, tests and packs
# without the npm token (and with read-only repository contents), `release` attaches the tarballs to the GitHub
# release, and `publish` (environment `release`: tags v*, the owner's approval) publishes exactly those tarballs after
# comparing them with `npm pack --ignore-scripts` of the tag; it installs nothing and runs no code of the repository.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.ref_name }}
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Access to private organization repositories
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "https://github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "ssh://git@github.com/just-tavrn/"
            git config --global --add url."https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/".insteadOf "git@github.com:just-tavrn/"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.TAVRN_READ_PAT || github.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No Actions cache in a release build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tag matches the package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          for p in sdk e2ee bot; do
            pv="$(node -p "require('./$p/package.json').version")"
            if [ "$pv" != "$v" ]; then
              echo "tag $TAG does not match $p/package.json version $pv" >&2
              exit 1
            fi
          done
      - run: pnpm install --frozen-lockfile
      - name: Checks (generated types, SPDX headers, dependency licenses, typecheck, tests)
        run: |
          scripts/check-generated.sh
          scripts/check-spdx.sh
          node scripts/check-js-licenses.mjs
          pnpm -r typecheck
          pnpm -r test
      - name: Pack the npm tarballs
        run: |
          mkdir -p release
          for p in sdk e2ee bot; do (cd "$p" && pnpm pack --pack-destination ../release); done
          ls -l release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: release/
          retention-days: 7

  release:
    name: GitHub release ${{ github.ref_name }}
    needs: build
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag release/*.tgz

  publish:
    name: Publish to npm
    needs: release
    if: ${{ vars.CI_ENABLED == 'true' && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # No install, no cache: npm publishes the tarballs the build job packed, after checking them against the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No registry-url: it would write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, which npm keeps as a literal
      # token when the variable is unset. Trusted publishing needs no token; npmjs.org is npm's default registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm supports trusted publishing
        run: |
          # Trusted publishing (the OIDC token exchange) needs npm 11.5.1 or later; this job installs nothing.
          v=$(npm --version)
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map((n) => parseInt(n, 10));
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$v"; then
            echo "npm $v of Node.js $(node --version) cannot use trusted publishing (needs npm >= 11.5.1)." >&2
            echo "Use a Node.js release that bundles a newer npm in actions/setup-node." >&2
            exit 1
          fi
          echo "npm $v"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/release
      - name: The tarballs to publish are the tag's files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # npm pack without scripts from the tag; pnpm pack of the build job only replaced workspace:* with the version.
          version="${TAG#v}" built="$RUNNER_TEMP/release" fresh="$RUNNER_TEMP/from-tag"
          mkdir -p "$fresh"
          for p in sdk e2ee bot; do (cd "$p" && npm pack --ignore-scripts --pack-destination "$fresh" >/dev/null); done
          for p in sdk e2ee bot; do
            n="tavrn-$p-$version.tgz"
            rm -rf "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"; mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
            tar -xzf "$built/$n" -C "$RUNNER_TEMP/a"; tar -xzf "$fresh/$n" -C "$RUNNER_TEMP/b"
            diff -r --exclude=package.json "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
            node -e '
              const fs = require("fs");
              const [packed, fromTag] = process.argv.slice(1, 3).map((f) => JSON.parse(fs.readFileSync(f, "utf8")));
              for (const k of ["dependencies", "peerDependencies", "optionalDependencies", "devDependencies"])
                for (const [d, r] of Object.entries(fromTag[k] ?? {})) if (r === "workspace:*") fromTag[k][d] = process.argv[3];
              require("assert").deepStrictEqual(packed, fromTag);
            ' "$RUNNER_TEMP/a/package/package.json" "$RUNNER_TEMP/b/package/package.json" "$version"
            echo "$n: the tag's files"
          done
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Published packages must not point at git repositories (private-phase references such as
          # github:just-tavrn/tavrn-crypto#v0.1.0&path:pkg become version ranges first): read from the packed manifests.
          for p in sdk e2ee bot; do
            tgz="$RUNNER_TEMP/release/tavrn-$p-$version.tgz"
            if tar -xOzf "$tgz" package/package.json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')).dependencies??{};process.exit(Object.values(d).some(s=>/^(github:|git\+|git:|https?:)/.test(s))?0:1)"; then
              echo "$p still has git dependencies; switch them to version ranges before publishing" >&2
              exit 1
            fi
          done
          # published NAME: whether npm has exactly $version of NAME (the version's own document, whose version field
          # must equal $version): 0 yes, 1 no (HTTP 404), anything else stops the job.
          published() {
            local body="$RUNNER_TEMP/registry.json" code
            code=$(curl -sS -o "$body" -w '%{http_code}' "https://registry.npmjs.org/${1/\//%2f}/$version")
            case "$code" in
              200) node -e '
                     const v = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version;
                     if (v !== process.argv[2]) { console.error(`unexpected version ${v} of ${process.argv[3]}`); process.exit(2); }
                   ' "$body" "$version" "$1" || exit 1 ;;
              404) return 1 ;;
              *) echo "$1 $version: HTTP $code" >&2; exit 1 ;;
            esac
          }
          for p in sdk e2ee bot; do
            if published "@tavrn/$p"; then
              echo "@tavrn/$p $version is already on npm: skipped"
            else
              npm publish "$RUNNER_TEMP/release/tavrn-$p-$version.tgz" --provenance --access public
            fi
          done
