packages:
  - sdk
  - e2ee
  - bot

# Only these packages may run install scripts (pnpm >= 12: allowBuilds).
allowBuilds:
  esbuild: true

# pnpm 12 waits for a release to age before installing it (minimumReleaseAge); our own packages are consumed the
# moment they are published, so the @tavrn scope is exempt.
minimumReleaseAgeExclude:
  - "@tavrn/*"

# Security overrides for transitive dependencies (keep each one justified; drop it once the dependant ships a fix).
# js-yaml: @hey-api/json-schema-ref-parser pins js-yaml 4.2.0 exactly, which has three high advisories
# (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh: CPU exhaustion). 4.3.2 is the fixed release of the
# same major with the same API; it only runs in the SDK generator (dev dependency), never in the published packages.
overrides:
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
